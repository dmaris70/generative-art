<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Load Paths — Generative Art</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    canvas { display: block; }
    a.back {
      position: fixed; top: 14px; left: 16px; z-index: 10;
      color: #7c5cff; font: 13px ui-sans-serif, system-ui, sans-serif;
      text-decoration: none; opacity: .55;
    }
    a.back:hover { opacity: 1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.plotsvg@latest/lib/p5.plotSvg.js"></script>
  <script src="../../assets/genart.js"></script>
  <script src="../../assets/plotter.js"></script>
</head>
<body>
  <a class="back" href="../../">← gallery</a>
  <script>
    // ?gui=0 is the plate-only view the headless renderer uses — no chrome on the paper.
    if (/[?&]gui=(0|false|off)\b/.test(location.search)) {
      document.querySelector('a.back').style.display = 'none';
    }
  </script>
  <script src="sketch.js"></script>
</body>
</html>
