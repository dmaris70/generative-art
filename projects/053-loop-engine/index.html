<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loop Engine — Generative Art</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; transition: background .2s; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    a.back {
      position: fixed; top: 14px; left: 16px; z-index: 10;
      color: #d8b4fe; font: 13px ui-sans-serif, system-ui, sans-serif;
      text-decoration: none; opacity: .7; mix-blend-mode: difference;
    }
    a.back:hover { opacity: 1; }
    #status {
      position: fixed; left: 16px; bottom: 14px; z-index: 10;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff; opacity: .6;
      mix-blend-mode: difference; pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
  <script src="../../assets/genart.js"></script>
  <script src="engine.js"></script>
</head>
<body>
  <a class="back" href="../../">← gallery</a>
  <canvas id="c"></canvas>
  <div id="status"></div>
  <script src="sketch.js"></script>
</body>
</html>
