<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Program Wall — executed-program grammar</title>
<style>
  :root{--bg:#07080a;--fg:#e6ecf2;--muted:#7c8794;--border:#1b2129;--accent:#8fd6e0;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#050608;color:var(--fg);overflow:hidden;
    font:13px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;padding:18px}
  #stage{line-height:0;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px;overflow:hidden;border:1px solid #12161c}
  #art{background:var(--bg);display:block}
  #cap{width:100%;max-width:660px}
  #cap .t{font-family:Georgia,serif;font-size:15px;color:#dfe6ee;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap .m{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);letter-spacing:.04em}
  #cap .src{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10px;color:#5c6672;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap .p{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;color:#586472;margin-top:5px;letter-spacing:.06em}
  #cap .p a{color:var(--accent);text-decoration:none;cursor:pointer}
  .controls{display:flex;gap:8px;align-items:center;margin-top:8px}
  .controls input,.controls button{font:inherit;font-size:12px;color:var(--fg);background:#10151b;border:1px solid var(--border);border-radius:7px;padding:5px 9px;cursor:pointer}
  .controls input{width:110px}
  #neutral{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:8%;text-align:center;
    background:rgba(5,6,8,.94);color:#aab4c0;font:13px/1.7 ui-serif,Georgia,serif;z-index:9998}
  #status{position:fixed;left:0;right:0;bottom:0;padding:6px 12px;background:#0b0e12;color:#9fb1c0;
    font:11px/1.45 ui-monospace,Menlo,monospace;z-index:9999;white-space:pre-wrap;border-top:1px solid #1b2129;display:none}
</style>
</head>
<body>
  <div id="stage"><canvas id="art" width="864" height="1152"></canvas></div>
  <div id="cap">
    <div class="t" id="cap-t">Program Wall — the executed program is the drawing</div>
    <div class="m" id="cap-m">a listing runs; its output fills the field in execution order</div>
    <div class="src" id="cap-src"></div>
    <div class="p"><span id="cap-stats"></span> · <a id="cap-png">save PNG ↓</a></div>
    <div class="controls" id="controls">
      <input id="seed" type="number" value="1" min="1"/>
      <button id="prev">← prev</button><button id="next">next →</button><button id="rand">↻ random</button>
    </div>
  </div>
  <div id="neutral"></div>
  <div id="status"></div>
<script>
/* PROGRAM GRAMMAR — enacts SYS-005 (sound = output of an executed program) and its
   code-native extreme SYS-014 (the code IS the piece). The drawing is COMPUTED by
   running a program:
     Tier A (code-native, sc140): the record's title IS the program; it is tokenised
       into a byte stream and executed.
     Tier B (data-driven): the stream is seeded from hash(id) — a synthetic bytecode.
   The stream drives a per-row cellular automaton (each row's rule byte is taken from
   the listing, scanning through it), and every 'on' cell is plotted as a luminous
   block in EXECUTION ORDER (row-major, top->bottom). In follow mode the reveal is
   bound to the playhead: the program executes at the pace of the recording. This is
   generation, not depiction (AMEND-023 enactment test). Screen aesthetic — the code
   counterpart to ductus/phase's paper. AMEND-026, grammar 'program'. */
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var el=function(id){return document.getElementById(id);};
var cv=el('art'), ctx=cv.getContext('2d');
var BG=[7,8,10], ON=[178,224,236];      // dark screen ground, luminous cyan-white cells
var D=null;

function looksLikeCode(s){ return /[{}()\[\];=]|\.ar|\.kr|SinOsc|Saw|LFNoise|Impulse|Pbind|play\{|Ringz|Comb|Latch/.test(s||''); }
function tokenize(s){
  var toks=(s||'').match(/[A-Za-z_]+|\d+\.?\d*|[{}()\[\].,*+\-\/=<>|&^%!:\\]/g)||[];
  var out=[];
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    out.push(/^\d/.test(t) ? (Math.floor(parseFloat(t))&255) : (hash32(t)&255));
  }
  return out;
}
function seededStream(seed,n){var r=mulberry32(seed>>>0),o=[];for(var i=0;i<n;i++)o.push(Math.floor(r()*256));return o;}

// build the program (stream) + field geometry, from a source string and/or a seed
function design(src, seed){
  var tierA=looksLikeCode(src);
  var stream = tierA ? tokenize(src) : seededStream(seed, 512);
  if(stream.length < 12) stream = seededStream(seed, 512), tierA=false;   // guard empty/tiny listings
  var C = 72 + (stream[0] % 40);       // columns (72..111), program-derived
  var R = 144;                         // rows (execution steps)
  return {tierA:tierA, src:src||'', stream:stream, C:C, R:R, seed:(seed>>>0), field:null};
}

// EXECUTE: a per-row elementary cellular automaton whose rule byte is read from the
// listing, scanning through it — the code drives the evolution.
function computeField(D){
  var C=D.C, R=D.R, st=D.stream, L=st.length;
  var rows=[], row=new Uint8Array(C);
  for(var c=0;c<C;c++) row[c]=(st[c%L] >> (c%8)) & 1;   // initial state from the opening bytes
  rows.push(row);
  for(var r=1;r<R;r++){
    var rule=st[r%L], prev=rows[r-1], nrow=new Uint8Array(C);
    for(var c=0;c<C;c++){
      var idx=(prev[(c-1+C)%C]<<2)|(prev[c]<<1)|prev[(c+1)%C];   // 3-cell neighbourhood 0..7
      nrow[c]=(rule>>idx)&1;
    }
    rows.push(nrow);
  }
  D.field=rows; return rows;
}

// PLOT: fill the field in execution order up to `frac` of the rows
function render(frac){
  var W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='rgb('+BG[0]+','+BG[1]+','+BG[2]+')'; ctx.fillRect(0,0,W,H);
  if(!D) return;
  if(!D.field) computeField(D);
  var mx=W*0.05, my=H*0.05, innerW=W-2*mx, innerH=H-2*my;
  var cw=innerW/D.C, ch=innerH/D.R;
  var revealed=Math.max(1, Math.ceil(D.R*Math.min(1, Math.max(0, frac))));
  var s=Math.max(1, Math.min(cw,ch)*0.82);
  for(var r=0;r<revealed;r++){
    var y=my+r*ch, a=0.55+0.35*((r%7)/7);     // faint per-row shimmer, deterministic
    ctx.fillStyle='rgba('+ON[0]+','+ON[1]+','+ON[2]+','+a.toFixed(3)+')';
    var frow=D.field[r];
    for(var c=0;c<D.C;c++) if(frow[c]) ctx.fillRect(mx+c*cw, y, s, s);
  }
  // program counter: bright scan-line at the current execution row
  var yc=my+(revealed-1)*ch;
  ctx.fillStyle='rgba(150,214,224,0.5)'; ctx.fillRect(mx, yc+ch, innerW, Math.max(1,ch*0.14));
}

function fit(){
  var availH=Math.max(240, window.innerHeight-210), availW=Math.max(240, window.innerWidth-40);
  var ar=cv.width/cv.height, h=availH, w=h*ar; if(w>availW){w=availW; h=w/ar;}
  cv.style.width=Math.round(w)+'px'; cv.style.height=Math.round(h)+'px';
}
window.addEventListener('resize', fit); fit();

function setStatus(t){var s=el('status'); s.style.display=''; s.textContent=t;}
function neutral(show,html){var n=el('neutral'); n.style.display=show?'flex':'none'; if(show&&html!=null) n.innerHTML=html;}
function esc(x){return String(x==null?'':x).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function setFrom(src, seed){ D=design(src, (seed>>>0)||1); el('seed').value=D.seed;
  el('cap-src').textContent = D.tierA ? ('src ▸ '+D.src.slice(0,72)) : ''; }
function stats(frac){
  el('cap-stats').textContent=(D.tierA?'Tier A · code-native':'Tier B · data-driven')
    +' · '+D.stream.length+' ops · '+D.C+'×'+D.R+' field · executed '+Math.round(Math.min(1,frac)*100)+'%';
}

// standalone controls (Tier B seeded; hidden in follow mode)
el('seed').addEventListener('change',function(){setFrom(null,parseInt(el('seed').value,10)||1); render(1); stats(1);});
el('prev').addEventListener('click',function(){setFrom(null,Math.max(1,D.seed-1)); render(1); stats(1);});
el('next').addEventListener('click',function(){setFrom(null,D.seed+1); render(1); stats(1);});
el('rand').addEventListener('click',function(){setFrom(null,Math.floor(Math.random()*999999)+1); render(1); stats(1);});
el('cap-png').addEventListener('click',function(){render(1); var a=document.createElement('a'); a.download='program-'+D.seed+'.png'; a.href=cv.toDataURL('image/png'); a.click();});

/* entry: ?seed=N (Tier B) · ?src=<program> (Tier A preview) · ?anim=1 self-clock ·
   ?follow=1 live from the radio (execution = playhead) · ?force=1 study override */
(function(){
  var q=new URLSearchParams(location.search);
  var sp=parseInt(q.get('seed'),10), src=q.get('src');
  setFrom(src, sp&&sp>0?sp:1);
  var follow=q.get('follow')==='1', force=q.get('force')==='1', anim=q.get('anim')==='1';
  if(!follow){
    if(anim){ var PERIOD=30000, t0=performance.now();
      (function loop(){ var f=((performance.now()-t0)%PERIOD)/PERIOD; render(f); stats(f); requestAnimationFrame(loop); })(); }
    else { render(1); stats(1); }
    return;
  }
  document.title='DMCF Radio — live program';
  el('controls').style.display='none';
  var lastId=null;
  (function tick(){
    try{
      if(!window.opener||window.opener.closed||!window.opener.DMCFArt){
        neutral(true,'<div>Player window closed — open DMCF-Radio-page.html and press <b>Program ↗</b>.</div>');
      } else {
        var info=window.opener.DMCFArt.now();
        if(info){
          var admitted=(info.grammar==='program')||force;
          if(admitted){
            neutral(false);
            if(info.id!==lastId){ lastId=info.id; setFrom(info.title, info.seed); }
            render(info.frac);
            el('cap-t').textContent=(info.title||'').slice(0,64)+'  —  '+(info.credit||'');
            el('cap-m').textContent=info.id+' · '+info.system+(info.sysName?' '+info.sysName:'')+(info.year?' · '+info.year:'');
            stats(info.frac);
            setStatus(info.id+'  ·  '+info.system+'  ·  '+(D.tierA?'Tier A code-native':'Tier B data-driven')
              +'  ·  executed '+Math.round(Math.min(1,info.frac)*100)+'%  ·  seed = hash(id) = '+(info.seed>>>0)
              + ((force&&info.grammar!=='program')?'\n[STUDY OVERRIDE — not an admitted record; program shown for verification only]':''));
          } else {
            neutral(true,
              '<div><div style="font-size:15px;color:#dfe6ee;margin-bottom:10px">Not admitted to the program grammar</div>'
              +'<div style="max-width:34em">The <b>program</b> grammar draws works whose rule is an <b>executed program</b> — '
              +'the code-native pieces (sc140, the title IS the program) and data-driven algorithmic works (Ikeda, Alva Noto). '
              +'Per <b>AMEND-023/026</b>, a record draws program only when admitted per-record (feed flag grammar=&#39;program&#39;). '
              +esc(info.id)+' ('+esc(info.system)+(info.sysName?' '+esc(info.sysName):'')+') draws <b>neutral</b> — '
              +'its canon drawing is on <b>Canon art ↗</b>.</div></div>');
            setStatus(esc(info.id)+'  ·  '+esc(info.system)+'  —  neutral (not admitted to program)');
          }
        }
      }
    }catch(e){}
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
