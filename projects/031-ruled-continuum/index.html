<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruled Continuum — Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }

        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif; font-size: 24px; font-weight: 500;
            color: var(--anthropic-dark); margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray); font-size: 13px;
            margin-bottom: 28px; line-height: 1.5;
        }

        .control-section { margin-bottom: 30px; }

        .control-section h3 {
            font-size: 16px; font-weight: 600; color: var(--anthropic-dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }

        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }

        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px;
            border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px;
            margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center;
        }

        .seed-input:focus {
            outline: none; border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white;
        }

        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 8px; }

        .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .preset-row .button { padding: 8px 4px; font-size: 12px; }

        .control-group { margin-bottom: 18px; }
        .control-group label {
            display: block; font-size: 14px; font-weight: 500;
            color: var(--anthropic-dark); margin-bottom: 8px;
        }

        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] {
            flex: 1; height: 4px; background: var(--anthropic-light-gray);
            border-radius: 2px; outline: none; -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: var(--anthropic-orange); border-radius: 50%; cursor: pointer;
            transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; background: var(--anthropic-orange);
            border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace; font-size: 12px;
            color: var(--anthropic-mid-gray); min-width: 52px; text-align: right;
        }

        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] {
            width: 32px; height: 32px; border: none; border-radius: 6px;
            cursor: pointer; background: none; padding: 0;
        }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }

        .button {
            background: var(--anthropic-orange); color: white; border: none;
            padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }

        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container {
            width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white;
        }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }

        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 80px; }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Ruled Continuum</h1>
            <div class="subtitle">Bundles of straight glissandi massed into ruled surfaces. Nothing curved is drawn — the curve is the envelope the lines conspire to reveal.</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="1955" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
                <div class="preset-row">
                    <button class="button" onclick="jumpSeed(1955)">1955</button>
                    <button class="button" onclick="jumpSeed(1958)">1958</button>
                    <button class="button" onclick="jumpSeed(61)">61</button>
                </div>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Glissando Bundles</label>
                    <div class="slider-container">
                        <input type="range" id="bundles" min="3" max="40" step="1" value="16" oninput="updateParam('bundles', this.value)">
                        <span class="value-display" id="bundles-value">16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Filament Density</label>
                    <div class="slider-container">
                        <input type="range" id="density" min="10" max="160" step="2" value="64" oninput="updateParam('density', this.value)">
                        <span class="value-display" id="density-value">64</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Weight</label>
                    <div class="slider-container">
                        <input type="range" id="lineWeight" min="0.2" max="2.0" step="0.1" value="0.6" oninput="updateParam('lineWeight', this.value)">
                        <span class="value-display" id="lineWeight-value">0.6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Ink Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="inkAlpha" min="4" max="60" step="1" value="20" oninput="updateParam('inkAlpha', this.value)">
                        <span class="value-display" id="inkAlpha-value">20</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Sheet Spread</label>
                    <div class="slider-container">
                        <input type="range" id="spread" min="0.10" max="0.60" step="0.02" value="0.36" oninput="updateParam('spread', this.value)">
                        <span class="value-display" id="spread-value">0.36</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Crossing</label>
                    <div class="slider-container">
                        <input type="range" id="crossing" min="0" max="1" step="0.02" value="0.72" oninput="updateParam('crossing', this.value)">
                        <span class="value-display" id="crossing-value">0.72</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Warp</label>
                    <div class="slider-container">
                        <input type="range" id="warp" min="0" max="1" step="0.02" value="0.40" oninput="updateParam('warp', this.value)">
                        <span class="value-display" id="warp-value">0.40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Accent Bundles</label>
                    <div class="slider-container">
                        <input type="range" id="accentRatio" min="0" max="0.5" step="0.01" value="0.15" oninput="updateParam('accentRatio', this.value)">
                        <span class="value-display" id="accentRatio-value">0.15</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Metric Ground</label>
                    <div class="slider-container">
                        <input type="range" id="gridOpacity" min="0" max="40" step="1" value="12" oninput="updateParam('gridOpacity', this.value)">
                        <span class="value-display" id="gridOpacity-value">12</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Ink (graphite)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#1a1916" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#1a1916</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Accent Ink</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#8c2f28" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#8c2f28</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Paper</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#f1ebdd" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#f1ebdd</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px;">
                    <button class="button secondary" onclick="regenerate()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()">↓ Download PNG</button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Composing ruled surfaces…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // RULED CONTINUUM — straight-line ruled-surface fields (seeded, static)
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 1955,
            bundles: 16,
            density: 64,
            lineWeight: 0.6,
            inkAlpha: 20,
            spread: 0.36,
            crossing: 0.72,
            warp: 0.40,
            accentRatio: 0.15,
            gridOpacity: 12,
            colorPalette: ['#1a1916', '#8c2f28', '#f1ebdd'] // ink, accent, paper
        };

        let defaultParams = JSON.parse(JSON.stringify(params));
        const S = 1200; // canvas size

        function setup() {
            let canvas = createCanvas(S, S);
            canvas.parent('canvas-container');
            pixelDensity(2);
            noLoop();
            const l = document.querySelector('.loading');
            if (l) l.style.display = 'none';
            render();
        }

        // p5 calls draw() on redraw(); we route it through the deterministic renderer
        function draw() { render(); }

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            return {
                r: parseInt(hex.substring(0, 2), 16),
                g: parseInt(hex.substring(2, 4), 16),
                b: parseInt(hex.substring(4, 6), 16)
            };
        }

        function render() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            const ink = hexToRgb(params.colorPalette[0]);
            const accent = hexToRgb(params.colorPalette[1]);
            const paper = hexToRgb(params.colorPalette[2]);

            background(paper.r, paper.g, paper.b);

            // --- Metric ground: the ruled sheet on which such structures are reasoned out ---
            drawGrid(ink);

            // --- Compose the bundles (glissandi) ---
            const margin = S * 0.12;
            const nB = params.bundles;

            for (let b = 0; b < nB; b++) {
                // position along the score's time axis, biased into an ascending diagonal
                const u = (b + random(-0.35, 0.35)) / nB;
                const cx = lerp(margin, S - margin, constrain(u, 0, 1)) + random(-S * 0.05, S * 0.05);
                const cy = lerp(S - margin, margin, constrain(u, 0, 1)) + random(-S * 0.14, S * 0.14);

                // glissando direction — around the ascending diagonal, with spread
                const ang = -QUARTER_PI + random(-1, 1) * (PI * 0.28);
                const len = params.spread * S * random(0.55, 1.35);
                const wid = len * random(0.10, 0.42);
                const twist = random(-1, 1) * params.warp * 0.7;

                const dir = p5.Vector.fromAngle(ang).mult(len / 2);
                const dirT = p5.Vector.fromAngle(ang + twist).mult(len / 2);
                const perp = p5.Vector.fromAngle(ang + HALF_PI).mult(wid / 2);

                // seeded endpoint jitter — keeps sheets off mechanical perfection
                const j = () => random(-1, 1) * params.warp * wid * 0.16;

                const A0 = createVector(cx - dir.x + perp.x + j(), cy - dir.y + perp.y + j());
                const A1 = createVector(cx + dir.x + perp.x + j(), cy + dir.y + perp.y + j());
                const B0 = createVector(cx - dirT.x - perp.x + j(), cy - dirT.y - perp.y + j());
                const B1 = createVector(cx + dirT.x - perp.x + j(), cy + dirT.y - perp.y + j());

                const useAccent = random() < params.accentRatio;
                const col = useAccent ? accent : ink;
                const a = params.inkAlpha * (useAccent ? 1.15 : 1.0);

                stroke(col.r, col.g, col.b, a);
                strokeWeight(params.lineWeight);

                const n = params.density;
                for (let k = 0; k < n; k++) {
                    const t = n > 1 ? k / (n - 1) : 0.5;
                    // curve-stitching: B-parameter runs in opposite phase, morphed by "crossing"
                    const tb = t * (1 - params.crossing) + (1 - t) * params.crossing;
                    const ax = lerp(A0.x, A1.x, t);
                    const ay = lerp(A0.y, A1.y, t);
                    const bx = lerp(B0.x, B1.x, tb);
                    const by = lerp(B0.y, B1.y, tb);
                    line(ax, ay, bx, by);
                }
            }

            // --- faint plate border ---
            noFill();
            stroke(ink.r, ink.g, ink.b, 40);
            strokeWeight(1);
            rect(S * 0.045, S * 0.045, S * 0.91, S * 0.91);
        }

        function drawGrid(ink) {
            if (params.gridOpacity <= 0) return;
            const fine = S / 60;      // millimeter feel
            const coarse = S / 12;    // major divisions
            strokeWeight(1);
            // fine grid
            stroke(ink.r, ink.g, ink.b, params.gridOpacity * 0.35);
            for (let x = 0; x <= S; x += fine) line(x, 0, x, S);
            for (let y = 0; y <= S; y += fine) line(0, y, S, y);
            // coarse grid
            stroke(ink.r, ink.g, ink.b, params.gridOpacity);
            for (let x = 0; x <= S; x += coarse) line(x, 0, x, S);
            for (let y = 0; y <= S; y += coarse) line(0, y, S, y);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        const intParams = { bundles: true, density: true, inkAlpha: true, gridOpacity: true };

        function updateParam(name, value) {
            params[name] = intParams[name] ? parseInt(value) : parseFloat(value);
            const disp = document.getElementById(name + '-value');
            if (disp) disp.textContent = intParams[name] ? params[name] : params[name].toFixed(2);
            redraw();
        }

        function updateColor(colorId, value) {
            const idx = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[idx] = value;
            const disp = document.getElementById(colorId + '-value');
            if (disp) disp.textContent = value;
            redraw();
        }

        // ── Seed controls ──
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }

        function updateSeed() {
            let v = parseInt(document.getElementById('seed-input').value);
            if (v && v > 0) { params.seed = v; redraw(); }
            else updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); redraw(); }
        function nextSeed() { params.seed = params.seed + 1; updateSeedDisplay(); redraw(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); redraw(); }
        function jumpSeed(s) { params.seed = s; updateSeedDisplay(); redraw(); }
        function regenerate() { redraw(); }

        function downloadPNG() { exportPNG('ruled-continuum-' + params.seed + '.png'); }

        // Robust PNG export — works in normal browsers and degrades gracefully
        // (Blob download → data-URL download → open in new tab) if a sandbox blocks it.
        function exportPNG(filename) {
            const cnv = document.querySelector('#canvas-container canvas');
            if (!cnv) return;
            const triggerBlob = () => new Promise((resolve, reject) => {
                if (!cnv.toBlob) return reject(new Error('no toBlob'));
                cnv.toBlob((blob) => {
                    if (!blob) return reject(new Error('null blob'));
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename; a.rel = 'noopener';
                    document.body.appendChild(a); a.click();
                    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
                    resolve();
                }, 'image/png');
            });
            triggerBlob().catch(() => {
                try {
                    const url = cnv.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); a.remove();
                } catch (e) {
                    try {
                        const w = window.open('', '_blank');
                        if (w) w.document.write('<title>' + filename + '</title><img src="' + cnv.toDataURL('image/png') + '" style="max-width:100%">');
                    } catch (e2) { /* sandbox fully blocks export — open the saved .html directly */ }
                }
            });
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            const set = (id, val, digits) => {
                const el = document.getElementById(id);
                const dsp = document.getElementById(id + '-value');
                if (el) el.value = val;
                if (dsp) dsp.textContent = (digits != null) ? Number(val).toFixed(digits) : val;
            };
            set('bundles', params.bundles);
            set('density', params.density);
            set('lineWeight', params.lineWeight, 1);
            set('inkAlpha', params.inkAlpha);
            set('spread', params.spread, 2);
            set('crossing', params.crossing, 2);
            set('warp', params.warp, 2);
            set('accentRatio', params.accentRatio, 2);
            set('gridOpacity', params.gridOpacity);
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            updateSeedDisplay();
            redraw();
        }

        window.addEventListener('load', function() { updateSeedDisplay(); });
    </script>
</body>
</html>
