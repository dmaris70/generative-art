<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Luminous Field — Generative Art</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas#wall { display: block; width: 100vw; height: 100vh; }
    a.back {
      position: fixed; top: 14px; left: 16px; z-index: 10;
      color: #e8d2b0; font: 13px ui-sans-serif, system-ui, sans-serif;
      text-decoration: none; opacity: .5; transition: opacity .3s;
    }
    a.back:hover { opacity: 1; }
    #status {
      position: fixed; left: 16px; bottom: 14px; z-index: 10; margin: 0;
      color: #b9ab95; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre; opacity: .7; pointer-events: none;
    }
    #hint {
      position: fixed; right: 16px; bottom: 14px; z-index: 10;
      color: #7d7466; font: 11px ui-sans-serif, system-ui, sans-serif; pointer-events: none;
    }
    #error { position: fixed; left: 16px; top: 44px; color: #f99; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
    /* bare: H hides everything but the wall */
    body.bare a.back, body.bare #status, body.bare #hint { display: none; }
    /* screen mode: the wall fills the window; details on I */
    body.screen #status { display: none; }
    body.screen.info #status { display: block; }
    #hint { transition: opacity 1.2s; }
    #hint.gone { opacity: 0; }
    /* kiosk: one canvas pixel per LED, top-left, nothing else, no cursor */
    body.kiosk { cursor: none; }
    body.kiosk canvas#wall { position: fixed; left: 0; top: 0; }
    body.kiosk a.back, body.kiosk #status, body.kiosk #hint { display: none; }
    @media (max-width: 640px) { #status { font-size: 9px; } #hint { display: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
  <script src="../../assets/genart.js"></script>
  <script src="../../assets/led.js"></script>
  <script src="engine.js"></script>
</head>
<body>
  <a class="back" href="../../">← gallery</a>
  <canvas id="wall" aria-label="Luminous Field — breathing fields of colour on an LED wall"></canvas>
  <pre id="status"></pre>
  <div id="hint">F fullscreen · R new seed · I info · H hide · L loupe · space pause · S save master</div>
  <pre id="error" hidden></pre>
  <script>
    addEventListener('error', e => { const el = document.getElementById('error'); el.textContent = '⚠ ' + e.message; el.hidden = false; });
  </script>
  <script src="sketch.js"></script>
</body>
</html>
