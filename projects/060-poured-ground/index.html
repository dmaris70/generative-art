<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poured Ground — Generative Art</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0e; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
    a.back { position: fixed; top: 14px; left: 16px; z-index: 10; color: #e8d9bf; font: 13px ui-sans-serif, system-ui, sans-serif; text-decoration: none; opacity: .6; }
    a.back:hover { opacity: 1; }
    #caption { position: fixed; left: 16px; bottom: 14px; z-index: 10; color: #cfc6b6; font: 12px/1.6 ui-sans-serif, system-ui, sans-serif; max-width: min(560px, calc(100vw - 32px)); pointer-events: none; text-shadow: 0 1px 2px #000; }
    #caption em { color: #efe6d6; }
    #caption a.view { color: #e8d9bf; pointer-events: auto; text-decoration: underline; text-underline-offset: 2px; }
    #caption .src { opacity: .6; }
    #caption i { display: inline-block; width: 12px; height: 12px; margin: 0 6px -2px 3px; border: 1px solid #0006; border-radius: 2px; }
    #caption .pig { margin-right: 4px; opacity: .65; }
    #caption .pig.on { opacity: 1; text-decoration: underline; }
    #track { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; background: #ffffff10; transition: opacity 1s; }
    #track.done { opacity: 0; }
    #bar { height: 100%; width: 0; background: #e8d9bf; }
    #status { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; background: #000c; color: #efe6d6; padding: 8px 14px; border-radius: 6px; font: 12px ui-sans-serif, system-ui, sans-serif; }
    #error { position: fixed; left: 16px; top: 44px; color: #f99; font: 12px ui-monospace, monospace; white-space: pre-wrap; z-index: 30; }
    /* the account: what the reader found, what it told the hand, and each move as it is made */
    /* the settings panel holds the right 260px, so the account sits clear of it */
    #account { position: fixed; top: 0; right: 268px; bottom: 0; width: min(400px, 34vw); z-index: 15;
      background: linear-gradient(to left, #0b0b0ef2 72%, #0b0b0e00); color: #cfc6b6;
      font: 12px/1.65 ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; }
    #account[hidden] { display: none; }
    #account .head { display: flex; gap: 8px; align-items: baseline; padding: 14px 18px 8px 24px; flex-wrap: wrap; }
    #account .head b { color: #efe6d6; font-weight: 600; letter-spacing: .02em; }
    #account .head button { background: none; border: 1px solid #ffffff22; color: #cfc6b6; border-radius: 4px;
      font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer; }
    #account .head button[aria-pressed="true"] { background: #ffffff14; color: #efe6d6; border-color: #ffffff44; }
    #account .head .sp { flex: 1; }
    #acctWalk { display: flex; gap: 10px; align-items: baseline; padding: 2px 18px 10px 24px; border-bottom: 1px solid #ffffff14; margin-bottom: 8px; }
    #acctWalk[hidden] { display: none; }
    #acctWalk a { color: #e8d9bf; text-decoration: none; border-bottom: 1px solid #e8d9bf55; font-size: 11px; }
    #acctWalk a:hover { border-bottom-color: #e8d9bf; }
    #acctWalk a.off { opacity: .3; pointer-events: none; border-bottom-color: transparent; }
    #acctWalk .pos { flex: 1; text-align: center; color: #8d8676; font-size: 10px; font-variant-numeric: tabular-nums; }
    #acctList { overflow-y: auto; padding: 0 18px 18px 24px; scrollbar-width: thin; }
    #acctList .ph { color: #8d8676; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; margin: 14px 0 6px; }
    #acctList .st { padding: 3px 0 3px 12px; border-left: 2px solid transparent; opacity: .45; transition: opacity .35s, border-color .35s, color .35s; }
    #acctList .st.on { opacity: 1; border-left-color: #e8d9bf66; }
    #acctList .st.now { opacity: 1; border-left-color: #e8d9bf; color: #efe6d6; }
    #acctList .st .at { color: #8d8676; font-size: 10px; margin-right: 6px; font-variant-numeric: tabular-nums; }
    #acctList.tech .st { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    /* narrow: the account becomes a sheet along the bottom rather than vanishing */
    @media (max-width: 1100px) {
      /* narrow, the settings panel goes full width, so the sheet sits above it and the x
         dismisses it; the settings' own "the account" entry brings it back */
      #account { top: auto; right: 0; left: 0; bottom: 0; width: auto; height: 42vh; z-index: 1002;
        background: linear-gradient(to top, #0b0b0ef8 80%, #0b0b0ec0); }
      #account .head { padding: 10px 16px 6px; }
      #acctList { padding: 0 16px 16px; }
      #caption { display: none; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
  <script src="../../assets/genart.js"></script>
</head>
<body>
  <a class="back" href="../../">← gallery</a>
  <a class="back" id="studioLink" href="studio.html" style="left:100px">print studio →</a>
  <a class="back" id="motionLink" href="?motion=1" style="left:215px">motion →</a>
  <script>{ const l = document.getElementById('studioLink'); l.addEventListener('click', () => { l.href = 'studio.html' + location.search; });
    const m = document.getElementById('motionLink'); m.addEventListener('click', (e) => { e.preventDefault(); window.PouredGroundApp && PouredGroundApp.setMotion(!PouredGroundApp.motion.on); }); }</script>
  <canvas id="gl" aria-label="Poured Ground"></canvas>
  <div id="caption"></div>
  <div id="track"><div id="bar"></div></div>
  <div id="account" hidden>
    <div class="head"><b>The account</b>
      <button id="acctPlain" aria-pressed="true">plain</button>
      <button id="acctTech" aria-pressed="false">technical</button>
      <button id="acctHide" title="hide (A)">×</button>
      <span class="sp"></span>
    </div>
    <div id="acctWalk" hidden></div>
    <div id="acctList"></div>
  </div>
  <div id="status" hidden></div>
  <pre id="error" hidden></pre>
  <script>addEventListener('error', e => { const el = document.getElementById('error'); el.textContent = '⚠ ' + e.message; el.hidden = false; });</script>
  <script src="palettes.js"></script>
  <script src="briefs.js"></script>
  <script src="originals.js"></script>
  <script src="links.js"></script>
  <script src="proportions.js"></script>
  <script src="readings.js"></script>
  <script src="engine.js"></script>
  <script src="narrate.js"></script>
  <script src="png.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
