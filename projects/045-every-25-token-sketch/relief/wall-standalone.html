<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Every 25-Token Sketch — the relief, for a wall</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="wall"></canvas>
<canvas id="hidden" width="140" height="100" style="display:none"></canvas>
<script>
// 045 — Every 25-Token Sketch.
//
// つぶやきProcessing — "tweet Processing" — is a Tokyo-born practice: a whole sketch in the
// 280 characters of one post. Most short programs draw little; the ones worth keeping were
// found by people, one at a time. This piece enumerates instead, and selects by a stated
// preference. It enumerates every program of a
// tiny pixel language — fifteen symbols, written postfix so that every well-formed string of
// them is a program — in order, shortest first, and draws each one as it arrives. A conveyor
// of 25 tiles shows the last 25 programs, their code beneath them; a slow lane keeps the one
// that scores best for having structure, and lets its claim fade so another can take it.
// Each dethroned champion drops into a column of the found, printed as it was at that moment.
// A picture that varies in one direction only (bands) scores half, so the lane is not taken by
// functions of x alone. Every picture is hashed (at t = 0
// and t = 1), so the sheet also counts distinct pictures — many programs draw the same one —
// and a picture already seen cannot take the lane. A ruler along the foot places the current
// program in the whole library on a log scale, shelf by shelf. The first 280 programs pass at
// one a frame — the 280 characters of a post — then the conveyor settles to 8 a second.
//
// The language: leaves x, y, t, 2, 25 · unary sin, cos, abs, sqrt, floor · binary + − × ÷ mod.
// A pixel at (x, y) ∈ [−2, 2]² at time t takes the value of the program, shown as a tone.
// There are 5 programs of one token, 25 of two, 250 of three, 2,500 of four, 28,125 of five,
// 328,125 of six. At 8 a second, a day reaches the sixth token. The first 25-token program
// is number 72,482,416,106,745,349,561,765,281 and arrives in 2.9 × 10¹⁷ years. The sketch
// does not stop.
//
// Enumeration is exact: the programs of each length are counted by a recurrence on stack
// depth, and the k-th program is unranked from that table (BigInt), so the order is the same
// for everyone, forever. The seed may shelve the library differently (another order of the
// alphabet); seed 1 is the canonical shelving.
//
// This file is the whole piece, free of any harness: Babel.create(canvas, options) runs it.
// sketch.js wires it to the gallery panel; neort.html is this file inlined with defaults.

const Babel = (function () {
  'use strict';

  const DEFAULTS = {
    seed: 1,             // 1: the canonical order of the alphabet · else the seed shuffles it
    rate: 8,             // programs a second
    from: 0,             // the program to begin at (its index in the enumeration)
    ground: 'dark',      // dark · paper
    fade: 0.9992,        // the champion's score decays by this per program, so it can be beaten
    prologue: 280,       // the first programs pass at one a frame (280: the characters of a post), then the rate
    at: null,            // a still: the conveyor and champion as they stand after this many programs
  };
  const PALETTE = {
    dark: { ground: '#0b0b0e', ink: '232,230,223', accent: '240,163,94', tileBg: '#101014' },
    paper: { ground: '#f4f0e8', ink: '27,27,27', accent: '200,85,61', tileBg: '#ebe6dc' },
  };
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';
  const W = 1400, H = 1000, MARGIN = 60;              // a landscape sheet: the conveyor left, the slow lane right
  const RES = 64;                                   // a sketch is drawn at 64 × 64, as a tweet is short
  const TILES = 25, COLS = 5;
  const MAX = 25;                                   // the longest program the library holds

  // ───────────────────────── the language ─────────────────────────
  // [symbol, arity, infix precedence, how to write it as code]
  const ALPHABET = [
    ['x', 0], ['y', 0], ['t', 0], ['2', 0], ['25', 0],
    ['sin', 1], ['cos', 1], ['abs', 1], ['sqrt', 1], ['floor', 1],
    ['+', 2], ['-', 2], ['*', 2], ['/', 2], ['mod', 2],
  ];
  const PREC = { '+': 1, '-': 1, '*': 2, '/': 2, mod: 2 };
  const JS = {
    sin: (a) => 'Math.sin(' + a + ')', cos: (a) => 'Math.cos(' + a + ')', abs: (a) => 'Math.abs(' + a + ')',
    sqrt: (a) => 'Math.sqrt(Math.abs(' + a + '))', floor: (a) => 'Math.floor(' + a + ')',
    '+': (a, b) => '(' + a + '+' + b + ')', '-': (a, b) => '(' + a + '-' + b + ')', '*': (a, b) => '(' + a + '*' + b + ')',
    '/': (a, b) => 'D(' + a + ',' + b + ')', mod: (a, b) => 'M(' + a + ',' + b + ')',
  };
  const D = (a, b) => (Math.abs(b) < 1e-9 ? (a < 0 ? -1e9 : 1e9) : a / b);
  const M = (a, b) => (Math.abs(b) < 1e-9 ? 0 : a - b * Math.floor(a / b));

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ───────────────────────── counting and unranking ─────────────────────────
  // ways[rem][d]: completions with rem tokens left from stack depth d, ending at depth 1
  const ways = [];
  for (let rem = 0; rem <= MAX; rem++) {
    ways[rem] = [];
    for (let d = 0; d <= MAX + 1; d++) {
      if (rem === 0) { ways[rem][d] = d === 1 ? 1n : 0n; continue; }
      let n = d + 1 <= MAX + 1 ? 5n * ways[rem - 1][d + 1] : 0n;
      if (d >= 1) n += 5n * ways[rem - 1][d];
      if (d >= 2) n += 5n * ways[rem - 1][d - 1];
      ways[rem][d] = n;
    }
  }
  const COUNT = ways.map((w) => w[0]);                // programs of each length
  const CUM = [0n]; for (let n = 1; n <= MAX; n++) CUM[n] = CUM[n - 1] + COUNT[n];

  // The k-th program (k from 0) in an alphabet order: its length, then its tokens by unranking.
  function program(k, order) {
    const K = BigInt(k);
    let n = 1; while (n <= MAX && K >= CUM[n]) n++;
    if (n > MAX) return null;
    let r = K - CUM[n - 1];
    const tokens = [];
    let d = 0;
    for (let i = 0; i < n; i++) {
      const rem = n - i - 1;
      for (const idx of order) {
        const [, ar] = ALPHABET[idx];
        if (d < ar) continue;
        const nd = d - ar + 1;
        if (nd > MAX + 1) continue;
        const c = ways[rem][nd];
        if (r < c) { tokens.push(idx); d = nd; break; }
        r -= c;
      }
    }
    return { k, n, tokens };
  }

  // Code for people (infix, minimal parentheses) and code for the machine (a JS function).
  function render(tokens) {
    const st = [], js = [];
    for (const idx of tokens) {
      const [sym, ar] = ALPHABET[idx];
      if (ar === 0) { st.push({ s: sym, p: 3 }); js.push(sym === 't' ? 't' : sym); }
      else if (ar === 1) { const a = st.pop(); st.push({ s: sym + '(' + a.s + ')', p: 3 }); js.push(JS[sym](js.pop())); }
      else {
        const b = st.pop(), a = st.pop(), p = PREC[sym];
        const L = a.p < p ? '(' + a.s + ')' : a.s;
        const R = b.p <= p ? '(' + b.s + ')' : b.s;          // x * (y mod t) is not (x * y) mod t
        st.push({ s: L + (sym === 'mod' ? ' mod ' : ' ' + sym + ' ') + R, p });
        const jb = js.pop(), ja = js.pop(); js.push(JS[sym](ja, jb));
      }
    }
    return { code: st[0].s, fn: new Function('x', 'y', 't', 'D', 'M', 'return ' + js[0] + ';') };
  }

  // ───────────────────────── the piece ─────────────────────────
  function create(canvas, options) {
    const O = Object.assign({}, DEFAULTS, options || {});
    const ctx = canvas.getContext('2d');
    const F = { x: MARGIN, y: MARGIN, w: W - 2 * MARGIN, h: H - 2 * MARGIN };
    let pal = PALETTE.dark, scale = 1, ox = 0, oy = 0;
    let order = [];
    let slots = [];                       // the conveyor: the last 25 programs
    let champ = null;                     // the slow lane
    let found = [];                       // the champions dethroned, newest first
    const seen = new Set();               // hashes of every picture so far
    let distinct = 0, dups = 0;
    let next = 0, clock = 0, last = 0, raf = 0, nextAt = 0, resizeTimer = 0;
    const tile = document.createElement('canvas'); tile.width = RES; tile.height = RES;
    const tctx = tile.getContext('2d'); const img = tctx.createImageData(RES, RES);
    const vals = new Float32Array(RES * RES);

    function layout() {
      const cw = canvas.clientWidth || window.innerWidth, ch = canvas.clientHeight || window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
      scale = Math.min(canvas.width / W, canvas.height / H);
      ox = (canvas.width - W * scale) / 2; oy = (canvas.height - H * scale) / 2;
    }
    function shelve() {
      order = [...Array(ALPHABET.length).keys()];
      if ((O.seed >>> 0) !== 1) {
        const r = mulberry32(O.seed >>> 0);
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      }
    }

    // ── one program: evaluate on the 64 × 64 field at time t, into vals; return a score ──
    function evaluate(fn, t) {
      let i = 0;
      for (let py = 0; py < RES; py++) {
        const y = -2 + (4 * (py + 0.5)) / RES;
        for (let px = 0; px < RES; px++) {
          const x = -2 + (4 * (px + 0.5)) / RES;
          let v = fn(x, y, t, D, M);
          if (!isFinite(v)) v = 0;
          vals[i++] = 0.5 + 0.5 * Math.sin(v);                     // a tone in [0, 1]
        }
      }
    }
    // structure: tonal range spread over the histogram, times a preference for edges in the
    // middle — a flat field scores 0, a plain gradient low (edge ≈ 0.01), bands, fans and
    // rings high (0.1 … 0.2), moiré and noise nothing (0.35 and up); measured, not guessed
    // A picture that varies along one axis only — bands, a function of x alone — scores half.
    function score() {
      const bins = new Float32Array(16); let gh = 0, gv = 0;
      for (let i = 0; i < RES * RES; i++) {
        bins[Math.min(15, Math.floor(vals[i] * 16))]++;
        if (i % RES) gh += Math.abs(vals[i] - vals[i - 1]);
        if (i >= RES) gv += Math.abs(vals[i] - vals[i - RES]);
      }
      let H = 0;
      for (let b = 0; b < 16; b++) if (bins[b]) { const p = bins[b] / (RES * RES); H -= p * Math.log2(p); }
      const g = (gh + gv) / (2 * RES * RES);                         // mean edge, 0 … ~0.5
      const flat = Math.min(gh, gv) < 0.05 * Math.max(gh, gv);       // one-dimensional
      return (H / 4) * Math.exp(-Math.pow((g - 0.13) / 0.09, 2)) * (flat ? 0.5 : 1);
    }
    // a picture's identity: its tones at t = 0 and t = 1, quantised to 16 levels and packed two
    // to a byte, hashed to 128 bits (MurmurHash3 x86_32 under four seeds). FNV-1a collided on
    // these structured inputs within the first 10,075 programs; Murmur3's mixing does not, and
    // at 128 bits a chance collision among a day's 187,000 programs is of order 10⁻²⁸.
    const packed = new Uint8Array(RES * RES);          // 8,192 nibbles → 4,096 bytes
    function murmur32(bytes, seed) {
      let h = seed >>> 0; const n = bytes.length - (bytes.length & 3);
      for (let i = 0; i < n; i += 4) {
        let k = bytes[i] | (bytes[i + 1] << 8) | (bytes[i + 2] << 16) | (bytes[i + 3] << 24);
        k = Math.imul(k, 0xcc9e2d51); k = (k << 15) | (k >>> 17); k = Math.imul(k, 0x1b873593);
        h ^= k; h = (h << 13) | (h >>> 19); h = (Math.imul(h, 5) + 0xe6546b64) >>> 0;
      }
      h ^= bytes.length; h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
      return h >>> 0;
    }
    function hashPicture(fn) {
      let j = 0;
      for (const t of [0, 1]) {
        evaluate(fn, t);
        for (let i = 0; i < RES * RES; i += 2) packed[j++] = Math.min(15, Math.floor(vals[i] * 16)) | (Math.min(15, Math.floor(vals[i + 1] * 16)) << 4);
      }
      return murmur32(packed, 0x9747b28c).toString(16) + murmur32(packed, 0x2545f491).toString(16) + murmur32(packed, 0x6c078965).toString(16) + murmur32(packed, 0x1e35a7bd).toString(16);
    }
    // a print: the field as it stands, kept as a small canvas
    function stamp() {
      const c = document.createElement('canvas'); c.width = RES; c.height = RES;
      paintTile(c.getContext('2d'), 0, 0, RES);
      return c;
    }
    function paintTile(cx, x, y, size) {
      const d = img.data;
      const [r1, g1, b1] = pal.ink.split(',').map(Number);
      const g = pal.tileBg, r0 = parseInt(g.slice(1, 3), 16), g0 = parseInt(g.slice(3, 5), 16), b0 = parseInt(g.slice(5, 7), 16);
      for (let i = 0; i < RES * RES; i++) {
        const v = vals[i];
        d[4 * i] = r0 + (r1 - r0) * v; d[4 * i + 1] = g0 + (g1 - g0) * v; d[4 * i + 2] = b0 + (b1 - b0) * v; d[4 * i + 3] = 255;
      }
      tctx.putImageData(img, 0, 0);
      cx.imageSmoothingEnabled = false;
      cx.drawImage(tile, x, y, size, size);
    }

    // ── the conveyor and the champion ──
    function arrive(at) {                 // at: the arrival's scheduled time
      const p = program(next, order);
      if (!p) return false;
      const { code, fn } = render(p.tokens);
      const entry = { k: next, n: p.n, code, fn, postfix: p.tokens.map((i) => ALPHABET[i][0]).join(' '), moves: p.tokens.includes(2) };
      const h = hashPicture(fn);
      entry.dup = seen.has(h);
      if (entry.dup) dups++; else { seen.add(h); distinct++; }
      evaluate(fn, at); entry.score = score();
      slots[next % TILES] = entry;
      if (champ) champ.score *= O.fade;
      if (!entry.dup && (!champ || entry.score > champ.score)) {
        if (champ) { evaluate(champ.fn, at); found.unshift({ k: champ.k, n: champ.n, code: champ.code, postfix: champ.postfix, moves: champ.moves, peak: champ.peak, score: champ.score, since: champ.since, until: at, print: stamp() }); }
        champ = Object.assign({}, entry, { since: at, peak: entry.score });
      }
      next++;
      return true;
    }

    // ── drawing ──
    const rgba = (c, a) => 'rgba(' + c + ',' + a + ')';
    const group = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = pal.ground; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(scale, 0, 0, scale, ox, oy);
      // the conveyor: 5 × 5 tiles with their code, on the left
      const gap = 10, size = (F.h - 22 * 5 - gap * 4) / 5, rowH = size + 22, gw = COLS * size + (COLS - 1) * gap;
      ctx.font = '10px ' + MONO; ctx.textBaseline = 'alphabetic';
      for (let i = 0; i < TILES; i++) {
        const e = slots[i];
        const x = F.x + (i % COLS) * (size + gap), y = F.y + Math.floor(i / COLS) * rowH;
        ctx.fillStyle = pal.tileBg; ctx.fillRect(x, y, size, size);
        if (!e) continue;
        evaluate(e.fn, clock); paintTile(ctx, x, y, size);
        const fresh = e.k === next - 1;
        ctx.fillStyle = rgba(fresh ? pal.accent : pal.ink, fresh ? 0.95 : e.dup ? 0.3 : 0.6); ctx.textAlign = 'left';
        ctx.fillText(clip(e.code + (e.dup ? ' = seen' : ''), size, 10), x, y + size + 14);
        if (e.moves) { ctx.fillStyle = rgba(pal.accent, 0.9); ctx.fillRect(x + size - 5, y + size + 7, 5, 5); }   // it uses t
      }
      // the slow lane: the champion, large, on the right
      const cx0 = F.x + gw + 40, cw = F.w - gw - 40;
      if (champ) {
        evaluate(champ.fn, clock); paintTile(ctx, cx0, F.y, cw);
        ctx.fillStyle = rgba(pal.accent, 0.95); ctx.font = '15px ' + MONO; ctx.textAlign = 'left';
        wrap(ctx, champ.code, cx0, F.y + cw + 28, cw, 20, 15);
        const ty = F.y + cw + 28 + 20 * 4;
        ctx.fillStyle = rgba(pal.ink, 0.55); ctx.font = '10px ' + MONO;
        ctx.fillText('as the library writes it: ' + champ.postfix, cx0, ty - 10);
        ctx.fillText('program ' + group(champ.k + 1) + ' · ' + champ.n + (champ.n === 1 ? ' token' : ' tokens') + ' · structure ' + champ.score.toFixed(3) + (champ.moves ? ' · uses t' : ' · no t'), cx0, ty + 8);
        ctx.fillText('the best so far; its claim fades, so another can take it', cx0, ty + 24);
      }
      // the found: the champions dethroned, printed as they were, the latest twelve newest first
      const fy = F.y + cw + 28 + 20 * 4 + 62, fg = 10, fs = (cw - 5 * fg) / 6;
      ctx.fillStyle = rgba(pal.ink, 0.55); ctx.font = '10px ' + MONO; ctx.textAlign = 'left';
      ctx.fillText('found: ' + group(found.length + (champ ? 1 : 0)) + ' sketches a person might have posted · latest twelve, newest first', cx0, fy - 8);
      ctx.imageSmoothingEnabled = false;
      for (let i = 0; i < Math.min(12, found.length); i++) {
        const f = found[i], x = cx0 + (i % 6) * (fs + fg), y = fy + Math.floor(i / 6) * (fs + 18);
        ctx.drawImage(f.print, x, y, fs, fs);
        ctx.fillStyle = rgba(pal.ink, 0.45); ctx.fillText(clip(group(f.k + 1), fs, 10), x, y + fs + 12);
      }
      // the ruler: the whole library on a log scale, a tick per shelf, the cursor at the program now
      const ry = H - 52, total = Math.log10(Number(CUM[MAX]));
      const rx = (k) => F.x + (F.w * Math.log10(Math.max(1, k))) / total;
      ctx.strokeStyle = rgba(pal.ink, 0.35); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(F.x, ry); ctx.lineTo(F.x + F.w, ry); ctx.stroke();
      ctx.fillStyle = rgba(pal.ink, 0.45); ctx.font = '9px ' + MONO; ctx.textAlign = 'center';
      for (let n = 1; n <= MAX; n++) {
        const x = rx(Number(CUM[n]));
        ctx.fillRect(x, ry - 4, 1, 8);
        ctx.fillText(String(n), x, ry + 16);
      }
      ctx.textAlign = 'left'; ctx.fillText('shelves: programs of 1 … 25 tokens, each about ten times the last', F.x, ry - 10);
      if (next > 0) {
        const x = rx(next);
        ctx.fillStyle = rgba(pal.accent, 0.95); ctx.fillRect(x - 1.5, ry - 7, 3, 14);
      }
      // the caption
      const e = slots[(next - 1 + TILES) % TILES];
      if (e) {
        const years = Number(CUM[MAX - 1] / BigInt(Math.round(O.rate))) / 31557600;
        ctx.fillStyle = rgba(pal.ink, 0.55); ctx.font = '11px ' + MONO; ctx.textAlign = 'left';
        const pace = next < O.prologue ? 'the first ' + group(O.prologue) + ' at a frame each' : group(O.rate) + ' a second';
        ctx.fillText('program ' + group(e.k + 1) + ' of the library · ' + e.n + (e.n === 1 ? ' token' : ' tokens') + ' · ' + group(distinct) + ' distinct pictures, ' + group(dups) + ' repeats · 15 symbols · ' + pace, F.x, H - 24);
        ctx.textAlign = 'right';
        ctx.fillText('the first 25-token sketch arrives in ' + sci(years) + ' years', F.x + F.w, H - 24);
      }
    }
    function sci(v) { const [m, e] = v.toExponential(1).split('e'); return m + ' × 10' + String(+e).replace(/\d/g, (d) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]); }
    function clip(s, width, px) { const n = Math.floor(width / (px * 0.6)); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
    function wrap(cx, s, x, y, width, lh, px) {
      const n = Math.max(8, Math.floor(width / (px * 0.6)));
      for (let i = 0, line = 0; i < s.length && line < 4; i += n, line++) cx.fillText(s.slice(i, i + n), x, y + line * lh);
    }

    // ── time ──
    function frame(now) {
      raf = requestAnimationFrame(frame);
      clock += (now - last) / 1000; last = now;        // the whole elapsed time, whatever the frame rate
      for (let n = 0; clock >= nextAt && n < 200; n++) {  // at most 200 arrivals a frame; the rest follow
        if (!arrive(nextAt)) break;
        nextAt += next <= O.prologue ? 1 / 60 : 1 / O.rate;
      }
      draw();
    }

    // ── export ──
    function sheetPNG() {
      const c = document.createElement('canvas'), k = 2;
      c.width = W * k; c.height = H * k;
      const cx = c.getContext('2d');
      cx.drawImage(canvas, ox, oy, W * scale, H * scale, 0, 0, W * k, H * k);
      return c;
    }

    // ── public ──
    function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout(); draw(); }, 120); }
    const api = {
      setOptions(o) { Object.assign(O, o); },
      reset() {
        pal = PALETTE[O.ground] || PALETTE.dark;
        cancelAnimationFrame(raf);
        shelve(); layout();
        slots = []; champ = null; found = []; seen.clear(); distinct = 0; dups = 0; next = Math.max(0, Math.floor(O.from)); clock = 0; nextAt = 0;
        if (O.at !== null) {                 // the still is the live state after that many arrivals
          for (let i = 0; i < Math.max(1, Math.floor(O.at)); i++) { clock = nextAt; if (!arrive(nextAt)) break; nextAt += next <= O.prologue ? 1 / 60 : 1 / O.rate; }
          draw();
        }
        else { last = performance.now(); raf = requestAnimationFrame(frame); }
      },
      resize() { layout(); draw(); },
      png: sheetPNG,
      program, render, COUNT, CUM, stats: () => ({ next, distinct, dups, found: found.length + (champ ? 1 : 0) }),
      // the found so far, newest first, each with its print as a data URL (for the print edition)
      found: () => found.map((f) => ({ k: f.k, n: f.n, code: f.code, postfix: f.postfix, moves: f.moves, peak: f.peak, score: f.score, since: f.since, until: f.until, print: f.print.toDataURL() })),
      champion: () => champ && { k: champ.k, n: champ.n, code: champ.code, postfix: champ.postfix, moves: champ.moves, peak: champ.peak, score: champ.score, since: champ.since, print: (evaluate(champ.fn, clock), stamp().toDataURL()) },
      destroy() { cancelAnimationFrame(raf); clearTimeout(resizeTimer); window.removeEventListener('resize', onResize); },
    };
    api.reset();
    window.addEventListener('resize', onResize);
    return api;
  }

  return { create, program, render, ALPHABET, COUNT, CUM, DEFAULTS };
})();

<script>
// The relief as a picture for an LED wall or any screen: the black steel panel, 2000 × 1500,
// drawn at the screen's size with its flip-dots turning, its counter rolling, its tickets
// printing into the pocket, its pointer creeping along the ruler — the same enumeration as the
// room, at one program a second, locked to the clock so that a restart resumes where the day
// is. No controls on screen. Query options:
//   ?start=09:00   program 1 at this local time today (default 09:00); the number follows the clock
//   ?rate=1        programs a second (the relief's pace; 8 is the screen's)
//   ?fade=0.9999 ?minhold=200   the room's selector (the defaults); ?fade=0.9992&minhold=0 the screen's
//   ?hold=45       seconds a ticket stands in the pocket before a visitor takes it, here imagined
//   ?sound=1       the flip-dots, the wheels and the printer, synthesised; needs a click or a kiosk
//                  flag to start (Chrome: --autoplay-policy=no-user-gesture-required)
//   ?dim=0.8       brightness 0 … 1 for a bright wall
//   ?record=120    record the canvas for N seconds and save wall.webm (for a video fallback)
// Keys: F full screen, S sound, Space pause.
(function () {
  const q = new URLSearchParams(location.search);
  const RATE = +(q.get('rate') || 1), FADE = +(q.get('fade') || 0.9999), MINHOLD = q.get('minhold') === null ? 200 : +q.get('minhold');
  const HOLD = +(q.get('hold') || 45), DIM = Math.max(0.1, Math.min(1, +(q.get('dim') || 1))), START = q.get('start') || '09:00', REC = +(q.get('record') || 0);
  let sound = q.get('sound') === '1', paused = false;
  const PITCH = 10, DOT = 3.7, W = 2000, H = 1500;
  const ROWS = [[1, "5", "DAY 1"], [2, "25", "DAY 1"], [3, "250", "DAY 1"], [4, "2,500", "DAY 1"], [5, "28,125", "DAY 1"], [6, "328,125", "DAY 2"], [7, "3,984,375", "DAY 16"], [8, "5.0 x 10^7", "DAY 186"], [9, "6.3 x 10^8", "YEAR 6"], [10, "8.2 x 10^9", "YEAR 80"], [11, "1.1 x 10^11", "1.0 x 10^3 YEARS"], [12, "1.4 x 10^12", "1.4 x 10^4 YEARS"], [13, "1.9 x 10^13", "1.8 x 10^5 YEARS"], [14, "2.6 x 10^14", "2.4 x 10^6 YEARS"], [15, "3.5 x 10^15", "3.2 x 10^7 YEARS"], [16, "4.7 x 10^16", "4.4 x 10^8 YEARS"], [17, "6.5 x 10^17", "6.0 x 10^9 YEARS"], [18, "9.0 x 10^18", "8.2 x 10^10 YEARS"], [19, "1.2 x 10^20", "1.1 x 10^12 YEARS"], [20, "1.7 x 10^21", "1.6 x 10^13 YEARS"], [21, "2.4 x 10^22", "2.2 x 10^14 YEARS"], [22, "3.4 x 10^23", "3.1 x 10^15 YEARS"], [23, "4.8 x 10^24", "4.3 x 10^16 YEARS"], [24, "6.7 x 10^25", "6.0 x 10^17 YEARS"], [25, "9.5 x 10^26", "8.5 x 10^18 YEARS"]];
  const cv = document.getElementById('wall'), ctx = cv.getContext('2d');
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  const order = [...Array(15).keys()];
  const D = (a, b) => (Math.abs(b) < 1e-9 ? (a < 0 ? -1e9 : 1e9) : a / b);
  const Mf = (a, b) => (Math.abs(b) < 1e-9 ? 0 : a - b * Math.floor(a / b));
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const cache = new Map();
  function fn(k) { if (!cache.has(k)) { const p = Babel.program(k, order); cache.set(k, { fn: Babel.render(p.tokens).fn, n: p.n }); if (cache.size > 400) cache.delete(cache.keys().next().value); } return cache.get(k); }

    const f = fn(k).fn;
    for (let j = 0; j < n; j++) { const y = -2 + (4 * (j + 0.5)) / n; for (let i = 0; i < n; i++) { const x = -2 + (4 * (i + 0.5)) / n; let v = f(x, y, t, D, Mf); if (!isFinite(v)) v = 0; const tone = 0.5 + 0.5 * Math.sin(v); out[j * n + i] = tone > (dither ? (BAYER[j & 3][i & 3] + 0.5) / 16 : 0.5) ? 1 : 0; } }
    return out;
  }
  // the program from the clock: program 1 at START today, RATE a second since
  function fromClock() { const [h, m] = START.split(':').map(Number); const now = new Date(), s = new Date(now); s.setHours(h, m, 0, 0); let el = (now - s) / 1000; if (el < 0) el += 86400; return Math.floor(el * RATE); }
  const M = Babel.create(document.getElementById('hidden'), { rate: RATE, prologue: 0, from: fromClock(), fade: FADE });
  const grp = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const printedOf = (found) => found.filter((f) => (f.until - f.since) * RATE >= MINHOLD);

  // ── layout ──
  let scale = 1, ox = 0, oy = 0;
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
    scale = Math.min(cv.width / W, cv.height / H); ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
  }
  addEventListener('resize', layout); layout();

  // ── flip-dot fields: each dot has a state, a target and a flip time; a change sweeps across the field ──
  function makeField(x, y, n, dither) { return { x, y, n, dither, state: new Uint8Array(n * n), target: new Uint8Array(n * n), at: new Float32Array(n * n).fill(-1), buf: new Uint8Array(n * n) }; }
  const tiles = [...Array(5)].map((_, i) => makeField(80 + i * 300, 80, 28, false));
  const lane = makeField(80, 420, 58, true);
  let flipsThisFrame = 0;
  function setField(f, bits, now) { for (let i = 0; i < bits.length; i++) if (bits[i] !== f.target[i]) { f.target[i] = bits[i]; f.at[i] = now + (i % f.n) * 0.004; } }
  function drawField(f, now) {
    const n = f.n;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const k = j * n + i; let v = f.state[k], sx = 1;

        const u = (now - f.at[k]) / 0.07;
        if (u >= 1) { f.state[k] = f.target[k]; f.at[k] = -1; v = f.state[k]; flipsThisFrame++; }
        else if (u > 0) { sx = Math.abs(Math.cos(u * Math.PI)); v = u < 0.5 ? f.state[k] : f.target[k]; }
      }
      ctx.fillStyle = v ? '#e8e6df' : '#1a1a1e';

      if (sx === 1) { ctx.beginPath(); ctx.arc(cx, cy, DOT, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(0.3, DOT * sx), DOT, 0, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  // ── the counter: 28 wheels; a wheel rolls to its new digit in 0.25 s ──
  const wheels = [...Array(28)].map(() => ({ d: 0, from: 0, at: -1 }));
  function setCounter(n, now) { const s = String(n).padStart(28, '0'); for (let i = 0; i < 28; i++) { const d = +s[i]; if (d !== wheels[i].d) { wheels[i].from = wheels[i].d; wheels[i].d = d; wheels[i].at = now; } } }
  function drawCounter(now) {
    ctx.fillStyle = '#17171b'; ctx.fillRect(712, 452, 520, 46);
    for (let i = 0; i < 28; i++) {
      const w = wheels[i], x = 720 + i * 18, y = 460;
      ctx.fillStyle = '#0d0d10'; ctx.fillRect(x, y, 16, 30);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, 16, 30); ctx.clip();
      ctx.fillStyle = i < 28 - String(M.stats().next).length ? 'rgba(232,230,223,0.28)' : '#e8e6df';
      ctx.font = '500 20px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let off = 0;
      if (w.at >= 0) { const u = Math.min(1, (now - w.at) / 0.25); off = (1 - (1 - Math.cos(u * Math.PI)) / 2) * 30; if (u >= 1) w.at = -1; ctx.fillText(String(w.from), x + 8, y + 15 - 30 + off); }
      ctx.fillText(String(w.d), x + 8, y + 15 + off);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(712, 452, 520, 6); ctx.fillRect(712, 492, 520, 6);   // the recess's shadow
  }

  // ── the ticket, as the printer prints it: the field dithered to 384 dots, seven lines ──
  const DPM = 8, PAPER_W = 58 * DPM, PRINT_W = 384, TICKET_H = 726;
  const ascii = (t) => t.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/·/g, '.');
  function ticketImage(f, no) {
    const c = document.createElement('canvas'); c.width = PAPER_W; c.height = TICKET_H; const g = c.getContext('2d');
    g.fillStyle = '#ece8de'; g.fillRect(0, 0, c.width, c.height);
    const x0 = (PAPER_W - PRINT_W) / 2, fk = fn(f.k).fn, vals = new Float32Array(64 * 64); let i = 0;
    for (let py = 0; py < 64; py++) { const yy = -2 + (4 * (py + 0.5)) / 64; for (let px = 0; px < 64; px++) { const xx = -2 + (4 * (px + 0.5)) / 64; let v = fk(xx, yy, f.until, D, Mf); if (!isFinite(v)) v = 0; vals[i++] = 0.5 + 0.5 * Math.sin(v); } }
    const Wd = PRINT_W, Hd = PRINT_W, e = new Float32Array(Wd * Hd), img = g.createImageData(Wd, Hd), d = img.data;
    for (let yy = 0; yy < Hd; yy++) for (let xx = 0; xx < Wd; xx++) e[yy * Wd + xx] = vals[Math.floor(yy / 6) * 64 + Math.floor(xx / 6)];

      if (yy + 1 < Hd) { if (xx) e[k + Wd - 1] += err * 3 / 16; e[k + Wd] += err * 5 / 16; if (xx + 1 < Wd) e[k + Wd + 1] += err * 1 / 16; }

    const when = new Date().toTimeString().slice(0, 8);
    const lines = [[ascii(f.code), true], [fit(ascii('library: ' + f.postfix))], [fit('program ' + grp(f.k + 1) + ' . ' + f.n + (f.n === 1 ? ' token' : ' tokens'))], [fit('structure ' + f.peak.toFixed(3) + ' . ' + (f.moves ? 'uses t' : 'no t'))], [fit('held the lane ' + grp(held) + (held === 1 ? ' program' : ' programs'))], [fit('found ' + grp(no) + ' . ' + when)], [fit('EVERY 25-TOKEN SKETCH . PCDTOKYO2026')]];
    let ly = 24 + PRINT_W + 30; g.fillStyle = '#181818'; g.textBaseline = 'top'; g.textAlign = 'left';
    for (const [text, bold] of lines) { g.font = (bold ? '700 ' : '500 ') + '21px ' + MONO; g.fillText(text.slice(0, 32), x0, ly + 2); ly += 24; }
    return c;
  }

  // ── the queue of one: the found that lasted wait; one ticket stands in the pocket; a visitor takes it after HOLD s ──
  const queue = [], queued = new Set();
  let pocket = null, lastTaken = -Infinity, printedNo = 0, paperFor = -1;
  function serve(now) {
    const pr = printedOf(M.found());
    if (pr.length !== paperFor) { if (paperFor >= 0) for (let i = pr.length - paperFor - 1; i >= 0; i--) if (!queued.has(pr[i].k)) { queued.add(pr[i].k); queue.push(pr[i]); } paperFor = pr.length; }
    if (pocket && pocket.takenAt < 0 && now - pocket.printedAt > HOLD) { pocket.takenAt = now; lastTaken = now; }
    if (pocket && pocket.takenAt >= 0 && now - pocket.takenAt > 0.8) pocket = null;
    if (!pocket && queue.length && now - lastTaken >= 3) { const f = queue.shift(); pocket = { f, img: ticketImage(f, ++printedNo), printedAt: now, takenAt: -1 }; soundPrint(); }
  }
  function drawReceipt(now) {
    ctx.fillStyle = '#17171b'; ctx.fillRect(720, 560, 120, 14);                                 // the slot
    ctx.fillStyle = '#060608'; ctx.fillRect(728, 563, 104, 5);
    if (pocket) {
      const u = Math.min(1, (now - pocket.printedAt) / 0.7), fed = 90.75 * u;                    // the ticket comes out of the slot picture up, last line first
      let alpha = 1, lift = 0;
      if (pocket.takenAt >= 0) { const v = Math.min(1, (now - pocket.takenAt) / 0.8); alpha = 1 - v; lift = 60 * v; }
      ctx.save(); ctx.globalAlpha = alpha;
      const top = 574 + fed - 90.75 - lift, visibleFrom = 574 - lift;                            // the top edge; above the slot is hidden
      ctx.beginPath(); ctx.rect(740, visibleFrom, 80, 200); ctx.clip();
      ctx.drawImage(pocket.img, 751, top + 7 + (u < 1 ? 0 : 0), 58, 90.75);
      ctx.restore();
    }
    ctx.fillStyle = '#1b1b20'; ctx.fillRect(746.5, 650, 67, 22);                                 // the pocket's front
    ctx.fillStyle = 'rgba(232,230,223,0.12)'; ctx.fillRect(746.5, 650, 67, 1);
    engrave('TAKE ONE', 762, 716, 11);
  }

  // ── the list, the ruler, the title ──
  function engrave(s, x, y, size, align) { ctx.fillStyle = 'rgba(232,230,223,0.55)'; ctx.font = '500 ' + size + 'px ' + MONO; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
  function drawList() {
    engrave('THE LIBRARY . TOKENS . PROGRAMS . BEGINS TO PRINT', 1920, 804, 13, 'right');
    ROWS.forEach(([n, c, b], i) => { const y = 846 + i * 18.2; engrave(String(n), 1560, y, 14, 'right'); engrave(c, 1710, y, 14, 'right'); engrave(b, 1920, y, 14, 'right'); });
    engrave('SIX OF THESE LINES WILL EVER BE TRUE FOR YOU', 1920, 1316, 13, 'right');
  }
  const total = Math.log10(Number(Babel.CUM[25]));
  const rx = (k) => 80 + (1840 * Math.log10(Math.max(1, k))) / total;
  function drawRuler(next) {
    ctx.fillStyle = '#8a7340'; ctx.fillRect(80, 1374, 1840, 12);
    ctx.fillStyle = '#2a2415';
    for (let n = 1; n <= 25; n++) { const x = rx(Number(Babel.CUM[n])); ctx.fillRect(x - 0.75, 1374, 1.5, 12); engrave(String(n), x, 1404, 11, 'center'); }
    const px = rx(Math.max(1, next)); ctx.fillStyle = '#e8e6df'; ctx.beginPath(); ctx.moveTo(px, 1368); ctx.lineTo(px - 6, 1356); ctx.lineTo(px + 6, 1356); ctx.closePath(); ctx.fill();
    engrave('EVERY 25-TOKEN SKETCH . A MACHINE READING A LIBRARY', 80, 1460, 13);
  }

  // ── sound, synthesised: a click per flip, a tick per wheel, the printer's buzz and hiss ──
  let AC = null, master = null;
  function audio() { if (!sound) return null; if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }
  function click(n, when) { const ac = audio(); if (!ac) return; const dur = 0.012, buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); const s = ac.createBufferSource(); s.buffer = buf; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200 + Math.random() * 800; f.Q.value = 2; const g = ac.createGain(); g.gain.value = Math.min(0.5, 0.06 * Math.sqrt(n)); s.connect(f); f.connect(g); g.connect(master); s.start(when); }
  function soundPrint() { const ac = audio(); if (!ac) return; const t = ac.currentTime; const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = 180; const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.75); const buf = ac.createBuffer(1, ac.sampleRate * 0.7, ac.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.3; const s = ac.createBufferSource(); s.buffer = buf; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000; const hg = ac.createGain(); hg.gain.value = 0.04; s.connect(hp); hp.connect(hg); hg.connect(master); s.start(t); }
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } if (e.key === 's' || e.key === 'S') { sound = !sound; if (sound) audio(); } if (e.key === ' ') paused = !paused; });
  addEventListener('click', () => { if (sound) audio(); });

  // ── the frame ──
  let lastNext = -1, lastChamp = -1, last = performance.now();
  const buf28 = new Uint8Array(28 * 28), buf58 = new Uint8Array(58 * 58);
  function frame(nowMs) {
    requestAnimationFrame(frame);
    const now = nowMs / 1000; last = nowMs;
    const s = M.stats(), champ = M.champion();

      setCounter(s.next, now);

    ctx.setTransform(scale, 0, 0, scale, ox, oy);
    ctx.fillStyle = '#0b0b0e'; ctx.fillRect(0, 0, W, H);
    flipsThisFrame = 0;
    for (const t of tiles) { ctx.fillStyle = '#101014'; ctx.fillRect(t.x - 6, t.y - 6, 292, 292); drawField(t, now); }
    ctx.fillStyle = '#101014'; ctx.fillRect(lane.x - 6, lane.y - 6, 592, 592); drawField(lane, now);
    drawCounter(now); drawReceipt(now); drawList(); drawRuler(s.next);
    if (DIM < 1) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(0,0,0,' + (1 - DIM) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (flipsThisFrame && sound) click(flipsThisFrame, audio().currentTime);
  }
  requestAnimationFrame(frame);
  // the piece's own clock drives the enumeration; pause holds the screen, not the clock, so the number stays true to the hour
  // (a paused wall simply stops drawing; the enumeration keeps the time)
  const draw0 = frame; void draw0;

  // ── recording, for a video fallback: ?record=N saves wall.webm after N seconds ──
  if (REC > 0 && cv.captureStream && window.MediaRecorder) {
    const stream = cv.captureStream(30), chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm', videoBitsPerSecond: 16e6 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'wall.webm'; document.body.appendChild(a); a.click(); };
    rec.start(1000); setTimeout(() => rec.stop(), REC * 1000);
  }
})();
