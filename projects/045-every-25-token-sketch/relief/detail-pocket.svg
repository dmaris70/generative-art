<text x="128" y="694" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">THE CHUTE AND THE POCKET ARE ONE FOLDED PART EACH, 1 MM AND 1.5 MM MILD STEEL, POWDER COATED WITH THE FACE; ALL PAPER-TOUCHING EDGES ROLLED OR DEBURRED</text>
<circle cx="120" cy="710" r="2.5" fill="#e8e6df"/>
<text x="128" y="714" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">LOAD THE ROLL SO THE PAPER CURLS TOWARD THE FACE; THE LEADING EDGE THEN DROPS INTO THE POCKET</text>
