<text x="128" y="734" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">SET THE SENSOR TRIMMER SO DO IS LOW WITH ONE SHEET 3 MM ABOVE THE LENS AND HIGH WITH NONE</text>
