<circle cx="40" cy="600" r="2.5" fill="#e8e6df"/>
<text x="48" y="604" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">RS-485: ONE SHIELDED TWISTED PAIR 24 AWG, A/B/GND, MODULE TO MODULE IN ADDRESS ORDER; TERMINATE 120 OHM AT THE LAST MODULE; SHIELD TO PE AT THE ADAPTER END ONLY</text>
<circle cx="40" cy="620" r="2.5" fill="#e8e6df"/>
<text x="48" y="624" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">24 V: 1.5 MM2 TO EACH BRANCH, STAR FROM THE BUS BAR; EACH MODULE ON ITS MAKER'S CONNECTOR; CHECK POLARITY BEFORE POWER</text>
<circle cx="40" cy="640" r="2.5" fill="#e8e6df"/>
<text x="48" y="644" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">STEPPERS: 4 x 0.5 MM2 TO EACH MOTOR; TMC2209 IN UART MODE, HOLD CURRENT UNDER 10 %; INDEX AND HOME SENSORS 3 x 0.25 MM2</text>
<circle cx="40" cy="660" r="2.5" fill="#e8e6df"/>
<text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">THE TIME SWITCH CUTS THE 24 V PSU AND THE PRINTER ADAPTER OUTSIDE HOURS; THE 5 V PSU AND THE CONTROLLER STAY ON</text>
<circle cx="40" cy="680" r="2.5" fill="#e8e6df"/>
<text x="48" y="684" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">SET THE 24 V PSU TO 24.0 V; THE MODULES REFRESH ONE AT A TIME UNDER SOFTWARE, SO PEAK CURRENT STAYS UNDER 4 A</text>
<circle cx="40" cy="700" r="2.5" fill="#e8e6df"/>
<text x="48" y="704" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">ALL CABLES IN THE REAR BAYS ON ADHESIVE MOUNTS, 100 MM FROM THE MODULE COIL SIDES; A SERVICE LOOP AT THE PRINTER</text>
</svg>