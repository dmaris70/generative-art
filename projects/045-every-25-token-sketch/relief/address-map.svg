<text x="708" y="304" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e6df" text-anchor="start">ADDRESS = TILE x 4 + ROW FOR THE CONVEYOR, ROW 0 AT THE TOP</text>
