<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plotted Sky, Live — Generative Art</title>
  <style>
    html, body { margin: 0; height: 100%; background: #16161a; color: #c9c5bb; overflow: hidden; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    #stage { position: fixed; inset: 0 0 72px 0; display: grid; place-items: center; }
    #gl, #ov { position: absolute; }
    #ov { pointer-events: none; }
    a.back { position: fixed; top: 14px; left: 16px; z-index: 10; color: #d8b4fe; font: 13px ui-sans-serif, system-ui, sans-serif; text-decoration: none; opacity: .6; }
    a.back:hover { opacity: 1; }
    #bar { position: fixed; left: 0; right: 0; bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; padding: 0 16px; }
    #bar label { display: inline-flex; gap: 6px; align-items: center; color: #a8a6b3; }
    #bar input[type=number] { width: 4.5em; background: #222128; color: #e8e4da; border: 1px solid #3a3740; border-radius: 3px; padding: 3px 4px; font: inherit; }
    #bar input[type=range] { width: 90px; accent-color: #d39a6d; }
    #bar button { background: #222128; color: #e8e4da; border: 1px solid #3a3740; border-radius: 3px; padding: 4px 8px; font: inherit; cursor: pointer; }
    #bar button:hover { border-color: #e8e4da; }
    #status { width: 100%; text-align: center; color: #8d8a97; }
    #err { position: fixed; top: 44px; left: 16px; color: #ffb4a8; white-space: pre-wrap; }
    body.bare #bar, body.bare a.back { display: none; }
    body.bare #stage { inset: 0; }
  </style>
</head>
<body>
  <a class="back" href="./">← the still sheets</a>
  <a class="back" style="left:170px" href="motion.html">the flip-book →</a>
  <div id="stage"><canvas id="gl" aria-label="Plotted Sky, live: plotted grass bending in gusts under a ruled sky that re-forms"></canvas><canvas id="ov"></canvas></div>
  <div id="bar">
    <label>field <input id="seed" type="number" min="1" value="7"></label>
    <label>view <input id="view-n" type="number" min="1" max="25" value="12"></label>
    <label>weather <input id="weather" type="number" min="0" max="48" value="0"></label>
    <label>wind <input id="wind" type="range" min="0" max="1.2" step="0.01" value="0.6"></label>
    <label>speed <input id="speed" type="range" min="0" max="3" step="0.05" value="1"></label>
    <button id="gen">Generate</button>
    <button id="go">Rebuild</button>
    <button id="pause">Pause</button>
    <button id="svg">Save SVG of this instant</button>
    <div id="status" role="status"></div>
  </div>
  <pre id="err" hidden></pre>
  <script src="../../assets/strokefont.js?v=1"></script>
  <script src="../048-plotted-field/field.js?v=6"></script>
  <script src="sky.js?v=3"></script>
  <script src="generate.js?v=1"></script>
  <script src="live.js?v=1"></script>
  <script src="live-page.js?v=1"></script>
</body>
</html>
