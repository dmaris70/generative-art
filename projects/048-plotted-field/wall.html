<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plotted Field — the wall</title>
  <style>
    :root { --ground: #0d0e10; }
    html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; cursor: none; }
    #stage { position: fixed; inset: 0; opacity: 0; transition: opacity .25s linear; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; right: 1.2vw; bottom: 1vh; color: #8d8a84; opacity: .55;
      font: 0.9vh/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="base"></canvas><canvas id="over"></canvas></div>
  <div id="hud" role="status"></div>
  <script data-engine src="../../assets/strokefont.js?v=1"></script>
  <script data-engine src="field.js?v=3"></script>
  <script src="wall.js?v=1"></script>
</body>
</html>
