<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramus — Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413; --anthropic-light: #faf9f5; --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc; --anthropic-orange: #d97757; --anthropic-blue: #6a9bcc; --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%); min-height: 100vh; color: var(--anthropic-dark); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,20,19,0.1); overflow-y: auto; overflow-x: hidden; }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 13px; margin-bottom: 28px; line-height: 1.5; }
        .control-section { margin-bottom: 30px; }
        .control-section h3 { font-size: 16px; font-weight: 600; color: var(--anthropic-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217,119,87,0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 8px; }
        .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .preset-row .button { padding: 8px 4px; font-size: 12px; }
        .control-group { margin-bottom: 18px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s ease; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 52px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%; }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: white; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 80px; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } .canvas-area { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Ramus</h1>
            <div class="subtitle">A single drawn gesture, planted and left to ramify. No grid governs this — only the branching of the line itself.</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="1972" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
                <div class="preset-row">
                    <button class="button" onclick="jumpSeed(1972)">1972</button>
                    <button class="button" onclick="jumpSeed(1974)">1974</button>
                    <button class="button" onclick="jumpSeed(88)">88</button>
                </div>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Root Gestures</label>
                    <div class="slider-container">
                        <input type="range" id="roots" min="1" max="12" step="1" value="6" oninput="updateParam('roots', this.value)">
                        <span class="value-display" id="roots-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Ramification Depth</label>
                    <div class="slider-container">
                        <input type="range" id="maxDepth" min="3" max="9" step="1" value="6" oninput="updateParam('maxDepth', this.value)">
                        <span class="value-display" id="maxDepth-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Angle</label>
                    <div class="slider-container">
                        <input type="range" id="branchAngle" min="8" max="60" step="1" value="26" oninput="updateParam('branchAngle', this.value)">
                        <span class="value-display" id="branchAngle-value">26</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Gesture Curl</label>
                    <div class="slider-container">
                        <input type="range" id="curl" min="0" max="1" step="0.02" value="0.40" oninput="updateParam('curl', this.value)">
                        <span class="value-display" id="curl-value">0.40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Length Decay</label>
                    <div class="slider-container">
                        <input type="range" id="lenDecay" min="0.60" max="0.95" step="0.01" value="0.80" oninput="updateParam('lenDecay', this.value)">
                        <span class="value-display" id="lenDecay-value">0.80</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Root Length</label>
                    <div class="slider-container">
                        <input type="range" id="rootLength" min="0.06" max="0.22" step="0.01" value="0.16" oninput="updateParam('rootLength', this.value)">
                        <span class="value-display" id="rootLength-value">0.16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Root Weight</label>
                    <div class="slider-container">
                        <input type="range" id="rootWeight" min="1" max="16" step="0.5" value="7" oninput="updateParam('rootWeight', this.value)">
                        <span class="value-display" id="rootWeight-value">7</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Weight Decay</label>
                    <div class="slider-container">
                        <input type="range" id="weightDecay" min="0.50" max="0.92" step="0.01" value="0.72" oninput="updateParam('weightDecay', this.value)">
                        <span class="value-display" id="weightDecay-value">0.72</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branchiness</label>
                    <div class="slider-container">
                        <input type="range" id="branchiness" min="0" max="1" step="0.02" value="0.50" oninput="updateParam('branchiness', this.value)">
                        <span class="value-display" id="branchiness-value">0.50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Ink Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="inkAlpha" min="60" max="255" step="5" value="200" oninput="updateParam('inkAlpha', this.value)">
                        <span class="value-display" id="inkAlpha-value">200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Sanguine Hand</label>
                    <div class="slider-container">
                        <input type="range" id="accentRatio" min="0" max="0.6" step="0.02" value="0.18" oninput="updateParam('accentRatio', this.value)">
                        <span class="value-display" id="accentRatio-value">0.18</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Ink</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#17120d" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#17120d</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Sanguine Accent</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#7a2418" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#7a2418</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Paper</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#efe7d6" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#efe7d6</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px;">
                    <button class="button secondary" onclick="regenerate()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()">↓ Download PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Growing the gesture…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // RAMUS — recursive calligraphic arborescence grown from seed gestures
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 1972,
            roots: 6,
            maxDepth: 6,
            branchAngle: 26,
            curl: 0.40,
            lenDecay: 0.80,
            rootLength: 0.16,
            rootWeight: 7,
            weightDecay: 0.72,
            branchiness: 0.50,
            inkAlpha: 200,
            accentRatio: 0.18,
            colorPalette: ['#17120d', '#7a2418', '#efe7d6'] // ink, accent, paper
        };
        let defaultParams = JSON.parse(JSON.stringify(params));
        const S = 1200;
        const MAXB = 26000;
        let branchCount = 0;
        let INK, ACC, PAPER;

        function setup() {
            let c = createCanvas(S, S);
            c.parent('canvas-container');
            pixelDensity(2);
            noLoop();
            const l = document.querySelector('.loading');
            if (l) l.style.display = 'none';
            render();
        }
        function draw() { render(); }

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
        }

        function render() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            branchCount = 0;

            INK = hexToRgb(params.colorPalette[0]);
            ACC = hexToRgb(params.colorPalette[1]);
            PAPER = hexToRgb(params.colorPalette[2]);

            background(PAPER.r, PAPER.g, PAPER.b);
            strokeCap(ROUND);
            strokeJoin(ROUND);

            const baseY = S - S * 0.10;
            const nR = params.roots;
            for (let r = 0; r < nR; r++) {
                const u = nR === 1 ? 0.5 : (r + random(-0.28, 0.28)) / (nR - 1);
                const rx = lerp(S * 0.12, S * 0.88, constrain(u, 0, 1));
                const heading = -HALF_PI + random(-0.55, 0.55);
                const col = random() < params.accentRatio ? ACC : INK;
                const phase = random(1000);
                grow(rx, baseY, heading, params.rootLength * S, params.rootWeight, 0, col, phase);
            }

            // faint plate border — paper, no grid
            noFill(); stroke(INK.r, INK.g, INK.b, 34); strokeWeight(1);
            rect(S * 0.04, S * 0.04, S * 0.92, S * 0.92);
        }

        function grow(x, y, angle, len, w, depth, col, phase) {
            if (branchCount > MAXB) return;

            const steps = max(4, floor(len / 12));
            const seg = len / steps;
            const wEnd = w * 0.82;              // mild within-branch taper
            let a = angle, px = x, py = y;

            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                // coherent gestural waver — one noise field bends every limb
                a += (noise(px * 0.006, py * 0.006, depth * 4.7 + phase) - 0.5) * 2 * params.curl * 0.65;
                const nx = px + cos(a) * seg;
                const ny = py + sin(a) * seg;
                strokeWeight(max(0.4, lerp(w, wEnd, t)));
                stroke(col.r, col.g, col.b, params.inkAlpha);
                line(px, py, nx, ny);
                px = nx; py = ny;
            }
            branchCount++;

            // ink pools slightly where a branch will divide
            if (w > 1.6) { noStroke(); fill(col.r, col.g, col.b, params.inkAlpha); circle(px, py, wEnd * 0.7); }

            if (depth >= params.maxDepth || len < S * 0.018) return;

            // how many children — mostly two, sometimes one or three
            let kids = 2;
            const rr = random();
            if (rr < params.branchiness * 0.5) kids = 3;
            else if (rr > 1 - (1 - params.branchiness) * 0.30) kids = 1;

            const div = radians(params.branchAngle);
            for (let k = 0; k < kids; k++) {
                const frac = kids === 1 ? 0 : (k / (kids - 1) - 0.5);
                const childAngle = a + frac * div * 2 + random(-0.12, 0.12);
                const childLen = len * params.lenDecay * random(0.85, 1.06);
                const childW = w * params.weightDecay;
                grow(px, py, childAngle, childLen, childW, depth + 1, col, phase);
            }
        }

        // ── UI handlers ──
        const intParams = { roots: true, maxDepth: true, branchAngle: true, inkAlpha: true };
        function updateParam(name, value) {
            params[name] = intParams[name] ? parseInt(value) : parseFloat(value);
            const disp = document.getElementById(name + '-value');
            if (disp) disp.textContent = intParams[name] ? params[name] : (name === 'rootWeight' ? params[name] : params[name].toFixed(2));
            redraw();
        }
        function updateColor(colorId, value) {
            const idx = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[idx] = value;
            const disp = document.getElementById(colorId + '-value');
            if (disp) disp.textContent = value;
            redraw();
        }

        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() { let v = parseInt(document.getElementById('seed-input').value); if (v && v > 0) { params.seed = v; redraw(); } else updateSeedDisplay(); }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); redraw(); }
        function nextSeed() { params.seed = params.seed + 1; updateSeedDisplay(); redraw(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); redraw(); }
        function jumpSeed(s) { params.seed = s; updateSeedDisplay(); redraw(); }
        function regenerate() { redraw(); }
        function downloadPNG() { exportPNG('ramus-' + params.seed + '.png'); }

        // Robust PNG export — works in normal browsers and degrades gracefully
        // (Blob download → data-URL download → open in new tab) if a sandbox blocks it.
        function exportPNG(filename) {
            const cnv = document.querySelector('#canvas-container canvas');
            if (!cnv) return;
            const triggerBlob = () => new Promise((resolve, reject) => {
                if (!cnv.toBlob) return reject(new Error('no toBlob'));
                cnv.toBlob((blob) => {
                    if (!blob) return reject(new Error('null blob'));
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename; a.rel = 'noopener';
                    document.body.appendChild(a); a.click();
                    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
                    resolve();
                }, 'image/png');
            });
            triggerBlob().catch(() => {
                try {
                    const url = cnv.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); a.remove();
                } catch (e) {
                    try {
                        const w = window.open('', '_blank');
                        if (w) w.document.write('<title>' + filename + '</title><img src="' + cnv.toDataURL('image/png') + '" style="max-width:100%">');
                    } catch (e2) { /* sandbox fully blocks export — open the saved .html directly */ }
                }
            });
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            const set = (id, val, digits) => {
                const el = document.getElementById(id), dsp = document.getElementById(id + '-value');
                if (el) el.value = val;
                if (dsp) dsp.textContent = (digits != null) ? Number(val).toFixed(digits) : val;
            };
            set('roots', params.roots);
            set('maxDepth', params.maxDepth);
            set('branchAngle', params.branchAngle);
            set('curl', params.curl, 2);
            set('lenDecay', params.lenDecay, 2);
            set('rootLength', params.rootLength, 2);
            set('rootWeight', params.rootWeight);
            set('weightDecay', params.weightDecay, 2);
            set('branchiness', params.branchiness, 2);
            set('inkAlpha', params.inkAlpha);
            set('accentRatio', params.accentRatio, 2);
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            updateSeedDisplay();
            redraw();
        }

        window.addEventListener('load', function() { updateSeedDisplay(); });
    </script>
</body>
</html>
